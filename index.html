<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f6ef7">
  <meta name="description" content="个人课表">
  <title>我的课表</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <div class="title-block">
        <h1>我的课表</h1>
        <p id="date-label" class="muted">—</p>
      </div>
      <span id="week-badge" class="week-badge"></span>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab active" role="tab" data-view="today">今天</button>
      <button class="tab" role="tab" data-view="week">本周</button>
    </nav>
  </header>

  <main>
    <section id="view-today" class="view active" role="tabpanel"></section>
    <section id="view-week" class="view" role="tabpanel"></section>
  </main>

  <footer class="footer">
    <span>数据在 <code>data.js</code> 里改</span>
  </footer>

  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
